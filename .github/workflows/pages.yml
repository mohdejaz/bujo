name: Deploy web PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the workflow to publish Pages, and let one deploy run at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs rather than one, and the split is the whole point of it. Uploading
# the artifact and deploying it used to sit in the same job, half a second
# apart — and twice the artifact API had not caught up with its own upload by
# the time deploy-pages asked for it, so a green upload was followed by "no
# artifacts named github-pages were found" and the site silently stayed a merge
# behind. The job boundary is the wait: the runner hands the artifact over,
# tears down and starts again, which puts seconds between the write and the
# read instead of milliseconds. It is also the shape GitHub's own starter
# workflow uses, for what is presumably this reason.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed for `git describe`
      - uses: actions/configure-pages@v5
      - name: Stamp asset URLs and service-worker cache with commit SHA
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" web/index.html web/sw.js
      - name: Stamp app version from git describe
        run: sed -i "s/__BUJO_VERSION__/$(git describe --tags --long --always)/" web/app.js
      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
