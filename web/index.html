<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="bujo" />
    <meta name="description" content="Tasks and notes on one page, events on a calendar. Offline, one thumb." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=__BUILD_ID__" />
    <title>bujo</title>
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>

    <header id="head">
      <div class="head-row">
        <!-- The three places anything can live, and the one that reads
             across them. Tasks are undated and sit on the Journal; events
             carry a date and sit on the Calendar; goals carry a due date and
             sit on Goals; Tags cuts the same lines the other way, one group
             at a time. Switching is the only navigation the app has. Each tab
             is an icon and nothing else — names never fit beside the notebook
             on a phone, and a toast names the page as you arrive. The name
             still reaches a screen reader through aria-label. -->
        <nav class="tabs" id="tabs" role="tablist" aria-label="Pages">
          <button class="tab is-on" id="tabJournal" data-view="journal" role="tab" aria-selected="true" aria-label="Journal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6h10M9.5 12h10M9.5 18h10M4.5 6h.01M4.5 12h.01M4.5 18h.01" /></svg>
          </button>
          <button class="tab" id="tabCalendar" data-view="calendar" role="tab" aria-selected="false" aria-label="Calendar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
          </button>
          <button class="tab" id="tabGoals" data-view="goals" role="tab" aria-selected="false" aria-label="Goals">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 21V3.5M5.5 4h12l-3 4.25 3 4.25h-12" /></svg>
          </button>
          <button class="tab" id="tabTags" data-view="tags" role="tab" aria-selected="false" aria-label="Tags">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4.5A1.5 1.5 0 014.5 3H12l9 9-7.5 7.5z" /><circle cx="7.5" cy="7.5" r="1.3" /></svg>
          </button>
        </nav>

        <div class="spacer"></div>

        <!-- Which notebook you are in, always on screen: the one thing you must
             never have to guess before writing a line. -->
        <button class="bookbtn" id="bookBtn">
          <span id="bookName">bujo</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
        </button>

        <button class="icon-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" stroke-width="2.8">
            <path d="M5 12h.01M12 12h.01M19 12h.01" />
          </svg>
        </button>
      </div>

      <!-- Today, in words, on both pages. It is the page's own date rather
           than a filter on it: nothing here narrows what is listed below. -->
      <div class="stamp" id="stamp">
        <span class="stamp-d" id="stampDow">Sunday</span>
        <span class="stamp-m" id="stampDmy">18 Oct</span>
      </div>

      <!-- The pages of this notebook, as tabs down its edge. Only the Journal
           shows them: it is the one page that reads a single page of the
           notebook at a time, while the Calendar, Goals and Tags read the
           whole of it. Filled in by renderPages. -->
      <div class="pages" id="pages" role="tablist" aria-label="Pages of this notebook" hidden></div>
    </header>

    <main id="page">
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
      <div class="tail"></div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <!-- On the Calendar an event needs a day, and on Goals a goal needs the
           day it is due by, so the composer grows a date field. It is the
           first child so it wraps onto its own row above the input rather than
           squeezing it. -->
      <div class="when" id="when" hidden>
        <label for="whenDate" id="whenLabel">on</label>
        <input type="date" id="whenDate" class="s-field when-date" />
      </div>
      <input
        id="input"
        type="text"
        placeholder="what needs doing?"
        enterkeyhint="done"
        autocapitalize="sentences"
        autocorrect="on"
      />
      <button type="submit" class="send" aria-label="Add">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
      </button>
    </form>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-scrim" data-close></div>
      <div class="sheet-card" role="dialog" aria-modal="true">
        <div class="sheet-grip"></div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <!-- A phone turned sideways: the app is portrait-shaped by design, and the
         orientation lock below only lands on installed/Android. This is the
         fallback for everyone else. -->
    <div class="rotate">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7.5" y="2.5" width="9" height="19" rx="2.5" />
        <path d="M12 18.5h.01" />
      </svg>
      <p>bujo is a portrait notebook.<br />Turn your phone upright.</p>
    </div>

    <div id="toast" class="toast" hidden>
      <span id="toastMsg"></span>
      <button id="toastUndo" type="button">Undo</button>
    </div>

    <script src="app.js?v=__BUILD_ID__"></script>
  </body>
</html>
