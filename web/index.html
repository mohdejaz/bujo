<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="bujo" />
    <meta name="description" content="A pocket bullet journal. Dot grid, one thumb, offline." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=__BUILD_ID__" />
    <title>bujo</title>
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>

    <header id="head">
      <div class="head-row">
        <button class="icon-btn" id="prevDay" aria-label="Previous day">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>

        <button class="datebtn" id="dateBtn">
          <span class="dow" id="dow">Saturday</span>
          <span class="dmy" id="dmy">30 August</span>
        </button>

        <button class="icon-btn" id="nextDay" aria-label="Next day">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
        </button>

        <div class="spacer"></div>

        <button class="ring-btn" id="ringBtn" aria-label="Day progress">
          <svg class="ring" viewBox="0 0 36 36">
            <circle class="ring-bg" cx="18" cy="18" r="15" />
            <circle class="ring-fg" cx="18" cy="18" r="15" id="ringFg" />
          </svg>
          <span class="ring-num" id="ringNum">0</span>
        </button>

        <button class="icon-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" stroke-width="2.8">
            <path d="M5 12h.01M12 12h.01M19 12h.01" />
          </svg>
        </button>
      </div>

      <nav class="strip" id="strip" aria-label="Week"></nav>
    </header>

    <main id="page">
      <section id="carry" class="carry" hidden></section>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
      <div class="tail"></div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <div class="types" role="radiogroup" aria-label="Entry type">
        <button type="button" class="type is-on" data-type="task" role="radio" aria-checked="true" aria-label="Task">
          <i class="b b-task"></i>
        </button>
        <button type="button" class="type" data-type="note" role="radio" aria-checked="false" aria-label="Note">
          <i class="b b-note"></i>
        </button>
        <button type="button" class="type" data-type="event" role="radio" aria-checked="false" aria-label="Event">
          <i class="b b-event"></i>
        </button>
      </div>
      <input
        id="input"
        type="text"
        placeholder="what's on the page?"
        enterkeyhint="done"
        autocapitalize="sentences"
        autocorrect="on"
      />
      <button type="submit" class="send" id="send" aria-label="Add">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
      </button>
    </form>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-scrim" data-close></div>
      <div class="sheet-card" role="dialog" aria-modal="true">
        <div class="sheet-grip"></div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden>
      <span id="toastMsg"></span>
      <button id="toastUndo" type="button">Undo</button>
    </div>

    <script src="app.js?v=__BUILD_ID__"></script>
  </body>
</html>
