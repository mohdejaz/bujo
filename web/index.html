<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bujo" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>bujo</title>
  </head>
  <body>
    <header id="bar">
      <span id="title">bujo</span>
      <span id="tools">
        <button id="themeBtn" title="Toggle light/dark" aria-label="Toggle light/dark">☀</button>
        <button id="fontDown" title="Smaller text" aria-label="Smaller text">A−</button>
        <button id="fontUp" title="Larger text" aria-label="Larger text">A+</button>
        <button id="importBtn" title="Import .db">import</button>
        <button id="exportBtn" title="Export .db">export</button>
      </span>
      <input id="fileInput" type="file" accept=".db,.sqlite,application/octet-stream" hidden />
    </header>

    <main id="output" aria-live="polite"></main>

    <div id="composer">
      <div id="prompt">(root)&nbsp;»</div>
      <form id="promptForm" autocomplete="off">
        <input
          id="cmd"
          type="text"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="send"
          placeholder="type a command — help"
        />
        <button id="sendBtn" type="submit" aria-label="Send">↑</button>
      </form>
    </div>

    <script src="vendor/sql-wasm.js"></script>
    <script src="js/bujo.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
