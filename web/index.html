<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="bujo" />
    <meta name="description" content="Tasks and notes on one page, events on a calendar. Offline, one thumb." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=__BUILD_ID__" />
    <title>bujo</title>
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>

    <header id="head">
      <div class="head-row">
        <!-- The notebook's contents, then the two places a line can live. The
             Index comes first the way a contents page does: it is where you
             turn to a page of the notebook, so it sits in front of the pages
             themselves rather than behind them. Tasks are undated and sit on
             the Journal; events carry a date and sit on the Calendar.
             Switching is the only navigation the app has. Each tab is an icon
             and nothing else — names never fit beside the notebook on a phone,
             and a toast names the page as you arrive. The name still reaches
             a screen reader through aria-label. -->
        <nav class="tabs" id="tabs" role="tablist" aria-label="Pages">
          <!-- a ribbon marking a page: the Index is how you turn to one -->
          <button class="tab" id="tabIndex" data-view="index" role="tab" aria-selected="false" aria-label="Index">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4.5-5.5 4.5z" /></svg>
          </button>
          <button class="tab is-on" id="tabJournal" data-view="journal" role="tab" aria-selected="true" aria-label="Journal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6h10M9.5 12h10M9.5 18h10M4.5 6h.01M4.5 12h.01M4.5 18h.01" /></svg>
          </button>
          <button class="tab" id="tabCalendar" data-view="calendar" role="tab" aria-selected="false" aria-label="Calendar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
          </button>
        </nav>

        <div class="spacer"></div>

        <!-- Which notebook you are in, always on screen: the one thing you must
             never have to guess before writing a line. -->
        <button class="bookbtn" id="bookBtn">
          <span id="bookName">bujo</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
        </button>

        <button class="icon-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" stroke-width="2.8">
            <path d="M5 12h.01M12 12h.01M19 12h.01" />
          </svg>
        </button>
      </div>

      <!-- Today, in words, on both pages. It is the page's own date rather
           than a filter on it: nothing here narrows what is listed below. -->
      <div class="stamp" id="stamp">
        <span class="stamp-d" id="stampDow">Sunday</span>
        <span class="stamp-m" id="stampDmy">18 Oct</span>
        <!-- Which page of the notebook you are writing on, at the far end of
             the date. The Journal is the only page split by pages, so it is
             the only one that can name one — the Calendar reads every page at
             once and the Index is the list of them. The mark is the Index's
             own tab icon, so the name reads as the page you are turned to and
             points at where you turn to another. -->
        <span class="stamp-p" id="stampPage" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4.5-5.5 4.5z" /></svg>
          <span id="stampPageName">log</span>
        </span>
      </div>
    </header>

    <main id="page">
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
      <div class="tail"></div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <!-- On the Calendar an event needs the day it falls on, so the composer
           grows a date field there. It is the first child so it wraps onto its
           own row above the input rather than squeezing it. -->
      <div class="when" id="when" hidden>
        <label for="whenDate" id="whenLabel">on</label>
        <input type="date" id="whenDate" class="s-field when-date" />
      </div>
      <input
        id="input"
        type="text"
        placeholder="what needs doing?"
        enterkeyhint="done"
        autocapitalize="sentences"
        autocorrect="on"
      />
      <button type="submit" class="send" aria-label="Add">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
      </button>
    </form>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-scrim" data-close></div>
      <div class="sheet-card" role="dialog" aria-modal="true">
        <div class="sheet-grip"></div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <!-- A phone turned sideways: the app is portrait-shaped by design, and the
         orientation lock below only lands on installed/Android. This is the
         fallback for everyone else. -->
    <div class="rotate">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="7.5" y="2.5" width="9" height="19" rx="2.5" />
        <path d="M12 18.5h.01" />
      </svg>
      <p>bujo is a portrait notebook.<br />Turn your phone upright.</p>
    </div>

    <div id="toast" class="toast" hidden>
      <span id="toastMsg"></span>
      <button id="toastUndo" type="button">Undo</button>
    </div>

    <script src="app.js?v=__BUILD_ID__"></script>
  </body>
</html>
